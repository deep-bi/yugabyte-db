name: DeepBI build and release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag, for example v2026.1.2.0-deepbi1
        required: true
        type: string
      publish_release:
        description: Publish a new GitHub Release after the Rocky 9 package tests pass
        type: boolean
        default: false

permissions: {}

jobs:
  complain:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: throw an error
        shell: bash
        run: |
          echo '::error::select an appropriate branch'
          exit 1
